<header class="w-full bg-white dark:bg-[#0f0f1a] border-b border-[#e8e8f0] dark:border-[#1e1e2e] shadow-[0_1px_16px_rgba(107,127,255,0.07)] transition-colors duration-300">
  <div class="h-0.5 bg-linear-to-r from-[#6B7FFF] via-[#8b9de8] to-[#c5cff7]"></div>

  <div class="max-w-5xl mx-auto px-6 h-14 flex items-center justify-between">

    <p [routerLink]="['/subjects']"
      class="cursor-pointer select-none flex items-center gap-2 group">
      <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-[#6B7FFF] group-hover:bg-[#4A5FE0] transition-colors duration-200">
        <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.966 8.966 0 0 0-6 2.292m0-14.25v14.25" />
        </svg>
      </span>
      <span class="font-lora text-lg text-[#1a1a2e] dark:text-white tracking-tight">
        Edu<span class="text-[#6B7FFF]">Path</span>
      </span>
    </p>

    <div class="flex items-center gap-3">

      <button (click)="themeService.toggle()"
        class="w-9 h-9 rounded-xl flex items-center justify-center border border-[#e8e8f0] dark:border-[#1e1e2e] hover:bg-[#F0F2FF] dark:hover:bg-[#1e1e2e] text-[#6B7FFF] transition-all duration-150 cursor-pointer">

        <svg *ngIf="themeService.darkMode" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
        </svg>

        <svg *ngIf="!themeService.darkMode" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>
      </button>

      <div *ngIf="isLoggedIn()" id="user-menu" class="relative">

        <button (click)="toggleDropdown()"
          class="flex items-center gap-2 pl-1 pr-3 py-1 rounded-full border border-[#e8e8f0] dark:border-[#1e1e2e] hover:border-[#6B7FFF] hover:bg-[#F0F2FF] dark:hover:bg-[#1e1e2e] transition-all duration-150 cursor-pointer">
          <span class="w-7 h-7 rounded-full overflow-hidden bg-[#6B7FFF] flex items-center justify-center shrink-0">
            <img *ngIf="userImage" [src]="userImage" class="w-full h-full object-cover" />
            <span *ngIf="!userImage" class="text-white text-xs font-semibold">
              {{ firstName.charAt(0).toUpperCase() }}
            </span>
          </span>
          <span class="text-sm text-[#1a1a2e] dark:text-white font-medium">{{ firstName }}</span>
          <svg class="w-3.5 h-3.5 text-[#6B7FFF] transition-transform duration-200"
            [class.rotate-180]="dropdownOpen"
            fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7" />
          </svg>
        </button>

        <div *ngIf="dropdownOpen"
          class="absolute right-0 mt-2 w-44 bg-white dark:bg-[#13131f] border border-[#e8e8f0] dark:border-[#1e1e2e] rounded-xl shadow-lg py-1 z-50">

          <button (click)="goToProfile()"
            class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-[#1a1a2e] dark:text-white hover:bg-[#F0F2FF] dark:hover:bg-[#1e1e2e] transition-colors cursor-pointer">
            <svg class="w-4 h-4 text-[#6B7FFF]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>
            Profile
          </button>

          <div class="border-t border-[#e8e8f0] dark:border-[#1e1e2e] my-1"></div>

          <button (click)="onLogout()"
            class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
            </svg>
            Logout
          </button>
        </div>
      </div>

    </div>
  </div>
</header>
