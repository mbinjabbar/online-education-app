<div
  class="subject-card bg-white dark:bg-[#13131f] rounded-2xl overflow-hidden border border-[#e8e8f0] dark:border-[#1e1e2e] cursor-pointer
  hover:shadow-[0_4px_24px_rgba(107,127,255,0.12)] transition-all duration-200 group"
  [routerLink]="['/subjects', subject.title]">

  <div class="relative aspect-video overflow-hidden bg-[#e8e8f0] dark:bg-[#1e1e2e]">
    <img
      class="w-full h-full object-cover"
      [src]="subject.bannerUrl"
      [alt]="subject.title" />

    <div class="absolute top-2 right-2 flex gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-150">
      <button
        (click)="onEdit($event)"
        title="Edit subject"
        class="w-7 h-7 rounded-lg bg-white/90 dark:bg-[#13131f]/90 backdrop-blur-sm flex items-center justify-center text-[#6B7FFF] hover:bg-[#6B7FFF] hover:text-white border border-[#e8e8f0] dark:border-[#2a2a3a] transition-all duration-150 cursor-pointer shadow-sm">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
        </svg>
      </button>
      <button
        (click)="onDelete($event)"
        title="Delete subject"
        class="w-7 h-7 rounded-lg bg-white/90 dark:bg-[#13131f]/90 backdrop-blur-sm flex items-center justify-center text-red-400 hover:bg-red-500 hover:text-white border border-[#e8e8f0] dark:border-[#2a2a3a] transition-all duration-150 cursor-pointer shadow-sm">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
        </svg>
      </button>
    </div>
  </div>

  <div class="px-4 py-4">
    <div class="flex items-center justify-between mb-2">
      <h2 class="font-lora text-base font-semibold text-[#1a1a2e] dark:text-white">
        {{ subject.title | titlecase }}
      </h2>
      <svg class="card-arrow w-4 h-4 text-[#6B7FFF] shrink-0 ml-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.966 8.966 0 0 0-6 2.292m0-14.25v14.25"/>
      </svg>
    </div>
    <p class="text-xs text-[#7a7a9a] dark:text-[#5a5a7a] font-light leading-relaxed line-clamp-2">
      {{ subject.description }}
    </p>
  </div>

</div>
