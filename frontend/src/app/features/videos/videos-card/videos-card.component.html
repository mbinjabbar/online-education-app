<div
  class="video-card bg-white dark:bg-[#13131f] rounded-2xl overflow-hidden border border-[#e8e8f0] dark:border-[#1e1e2e] cursor-pointer hover:shadow-[0_4px_24px_rgba(107,127,255,0.12)] transition-all duration-200 group"
  (click)="openModal(video)">

  <div class="relative aspect-video overflow-hidden bg-[#e8e8f0] dark:bg-[#1e1e2e]">
    <img class="w-full h-full object-cover" [src]="video.bannerUrl" [alt]="video.title" />
    <div class="play-overlay absolute inset-0 bg-[#1a1a2e]/40 opacity-0 flex items-center justify-center">
      <div class="w-11 h-11 rounded-full bg-white/90 flex items-center justify-center shadow-lg">
        <svg class="w-5 h-5 text-[#6B7FFF] ml-0.5" fill="currentColor" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
    </div>
    <span class="absolute top-2.5 left-2.5 bg-[#6B7FFF] text-white text-[10px] font-medium px-2 py-0.5 rounded-lg">
      Lec {{ lecNumber }}
    </span>

    <div class="absolute top-2 right-2 flex gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-150">
      <button
        (click)="onEdit($event)"
        title="Edit video"
        class="w-7 h-7 rounded-lg bg-white/90 dark:bg-[#13131f]/90 backdrop-blur-sm flex items-center justify-center text-[#6B7FFF] hover:bg-[#6B7FFF] hover:text-white border border-[#e8e8f0] dark:border-[#2a2a3a] transition-all duration-150 cursor-pointer shadow-sm">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
        </svg>
      </button>
      <button
        (click)="onDelete($event)"
        title="Delete video"
        class="w-7 h-7 rounded-lg bg-white/90 dark:bg-[#13131f]/90 backdrop-blur-sm flex items-center justify-center text-red-400 hover:bg-red-500 hover:text-white border border-[#e8e8f0] dark:border-[#2a2a3a] transition-all duration-150 cursor-pointer shadow-sm">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
        </svg>
      </button>
    </div>
  </div>

  <div class="px-4 py-3.5">
    <h2 class="font-lora text-sm font-semibold text-[#1a1a2e] dark:text-white leading-snug mb-1 truncate">
      {{ video.title | titlecase }}
    </h2>
    <div class="flex items-center justify-between">
      <p class="text-xs text-[#7a7a9a] dark:text-[#5a5a7a] font-light">{{ video.subjectName | titlecase }}</p>
      <svg class="w-4 h-4 text-[#6B7FFF]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.91 11.672a.375.375 0 0 1 0 .656l-5.603 3.113a.375.375 0 0 1-.557-.328V8.887c0-.286.307-.466.557-.328l5.603 3.113z"/>
      </svg>
    </div>
  </div>
</div>


<div
  *ngIf="isModalOpen"
  class="fixed inset-0 bg-[#1a1a2e]/60 backdrop-blur-sm flex items-center justify-center z-50 p-4"
  (click)="closeModal()">

  <div
    class="w-full max-w-3xl bg-white dark:bg-[#13131f] rounded-2xl overflow-hidden shadow-[0_24px_64px_rgba(26,26,46,0.25)]"
    (click)="$event.stopPropagation()">

    <div class="flex items-start justify-between px-5 py-4 border-b border-[#e8e8f0] dark:border-[#1e1e2e]">
      <div>
        <p class="font-lora text-lg font-semibold text-[#1a1a2e] dark:text-white leading-snug">
          Lec {{ lecNumber }}: {{ selectedVideo?.title | titlecase }}
        </p>
        <p class="text-xs text-[#7a7a9a] dark:text-[#5a5a7a] mt-0.5 font-light">{{ selectedVideo?.subjectName | titlecase }}</p>
      </div>
      <button type="button" (click)="closeModal()"
        class="ml-4 mt-0.5 w-7 h-7 rounded-lg flex items-center justify-center text-[#a0a0c0] hover:bg-[#F0F2FF] dark:hover:bg-[#1e1e2e] hover:text-[#6B7FFF] transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="video-wrapper relative bg-[#0f0f1a] group">
      <video
        #videoPlayer
        [src]="selectedVideo?.url"
        class="w-full aspect-video"
        (timeupdate)="updateProgress()"
        (loadedmetadata)="setDuration()"
        (play)="isPlaying = true"
        (pause)="isPlaying = false">
      </video>

      <div class="controls-bar absolute bottom-0 left-0 right-0 bg-linear-to-t from-[#0f0f1a]/90 to-transparent px-4 pb-4 pt-8 opacity-100">
        <input type="range" class="w-full mb-3" min="0" [max]="duration" [value]="currentTime" (input)="seek($event)" />
        <div class="flex items-center gap-3">
          <button (click)="togglePlay()" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-[#6B7FFF]/30 flex items-center justify-center transition-colors">
            <svg *ngIf="!isPlaying" class="w-4 h-4 text-white ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg *ngIf="isPlaying" class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button (click)="skip(-5)" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-[#6B7FFF]/30 flex items-center justify-center transition-colors">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9.75 9.75 12m0 0 2.25 2.25M9.75 12h12.75m-4.5-4.5a9 9 0 1 0 0 9"/>
            </svg>
          </button>
          <button (click)="skip(5)" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-[#6B7FFF]/30 flex items-center justify-center transition-colors">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9.75 14.25 12m0 0-2.25 2.25M14.25 12H1.5m4.5-4.5a9 9 0 1 1 0 9"/>
            </svg>
          </button>
          <span class="text-white/70 text-xs font-light tabular-nums">
            {{ currentTime | number:'1.0-0' }} / {{ duration | number:'1.0-0' }} sec
          </span>
          <div class="flex-1"></div>
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-white/70 shrink-0" fill="currentColor" viewBox="0 0 24 24">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
            </svg>
            <input type="range" class="volume-slider" min="0" max="1" step="0.1" [value]="volume" (input)="changeVolume($event)" />
          </div>
          <button (click)="toggleFullScreen()" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-[#6B7FFF]/30 flex items-center justify-center transition-colors">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
